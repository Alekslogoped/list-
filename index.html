<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Осенний листопад</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #dcefcf;
    }

    button {
      font: inherit;
    }


    /* ==================================================
       ВСЯ ИГРА
    ================================================== */

    #game {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #dcefcf;
    }


    /* ==================================================
       ЭКРАНЫ
    ================================================== */

    .screen {
      position: absolute;
      inset: 0;
      display: none;
    }

    .screen.active {
      display: block;
    }


    /* ==================================================
       СТАРТОВЫЙ ЭКРАН
    ================================================== */

    #startScreen {
      background-image:
        linear-gradient(
          rgba(255,255,255,.10),
          rgba(255,255,255,.10)
        ),
        url("fon.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    .start-card {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(650px, 88vw);

      padding: 32px 28px;

      text-align: center;

      border-radius: 30px;

      background: rgba(255,255,255,.93);

      box-shadow:
        0 12px 35px
        rgba(68,71,34,.20);
    }


    .start-card h1 {
      margin: 0 0 10px;

      color: #b25420;

      font-size:
        clamp(38px, 6vw, 68px);

      line-height: 1;
    }


    .start-card p {
      margin: 18px auto 26px;

      max-width: 520px;

      color: #47543e;

      font-size:
        clamp(18px, 2.4vw, 27px);

      line-height: 1.4;
    }


    .main-btn {
      min-height: 58px;

      padding: 15px 30px;

      border: 0;
      border-radius: 20px;

      background: #e8762e;

      color: white;

      font-weight: 900;

      font-size:
        clamp(18px, 2vw, 25px);

      cursor: pointer;

      box-shadow:
        0 7px 0 #b6521e;
    }


    .main-btn:active {
      transform: translateY(4px);

      box-shadow:
        0 3px 0 #b6521e;
    }


    /* ==================================================
       ИГРОВОЙ ЭКРАН
    ================================================== */

    #playScreen {
      background-image:
        url("fon.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* ==================================================
       ВЕРХНЯЯ ПАНЕЛЬ
    ================================================== */

    .topbar {
      position: absolute;

      top: 14px;
      left: 14px;
      right: 14px;

      z-index: 100;

      display: grid;

      grid-template-columns:
        auto 1fr auto;

      gap: 12px;

      align-items: center;
    }


    .pill {
      min-height: 54px;

      padding: 12px 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: rgba(255,255,255,.94);

      color: #45503e;

      font-weight: 900;

      font-size:
        clamp(15px, 1.8vw, 22px);

      box-shadow:
        0 5px 16px
        rgba(0,0,0,.12);
    }


    #taskPill {
      color: #a84b1e;

      font-size:
        clamp(19px, 2.4vw, 30px);
    }


    #targetLetter {
      display: inline-grid;

      place-items: center;

      width: 42px;
      height: 42px;

      margin-left: 8px;

      border-radius: 50%;

      background: #e8762e;

      color: white;

      font-size: 27px;
    }


    .sound-btn {
      width: 54px;
      height: 54px;

      border: 0;
      border-radius: 18px;

      background:
        rgba(255,255,255,.94);

      cursor: pointer;

      font-size: 28px;

      box-shadow:
        0 5px 16px
        rgba(0,0,0,.12);
    }


    /* ==================================================
       ПОЛЕ С ЛИСТЬЯМИ
    ================================================== */

    #leafField {
      position: absolute;

      inset: 78px 0 0;

      overflow: hidden;

      z-index: 10;
    }


    /* ==================================================
       ЛЕТЯЩИЙ ЛИСТ
    ================================================== */

    .leaf {
      position: absolute;

      left: 0;
      top: 0;

      width:
        clamp(120px, 13vw, 190px);

      height:
        clamp(120px, 13vw, 190px);

      padding: 0;

      border: 0;

      background: transparent;

      cursor: pointer;

      touch-action: manipulation;

      transform-origin: center;

      will-change: transform;
    }


    .leaf-inner {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* настоящий PNG-лист */

    .leaf-image {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;

      filter:
        drop-shadow(
          0 6px 5px
          rgba(88,44,15,.22)
        );
    }


    /* картинка на листе */

    .object-image {
      position: absolute;

      z-index: 3;

      width: 47%;
      height: 47%;

      object-fit: contain;

      pointer-events: none;

      filter:
        drop-shadow(
          0 3px 2px
          rgba(0,0,0,.16)
        );
    }


    /* ==================================================
       ПРАВИЛЬНЫЙ ВЫБОР
    ================================================== */

    .leaf.correct {
      pointer-events: none;

      animation:
        correctLeaf
        .55s ease forwards;
    }


    @keyframes correctLeaf {

      0% {
        opacity: 1;
      }

      40% {
        opacity: .8;
      }

      100% {
        opacity: 0;
      }

    }


    /* ==================================================
       ОШИБКА
    ================================================== */

    .leaf.wrong .leaf-inner {
      animation:
        wrongLeaf
        .45s ease;
    }


    @keyframes wrongLeaf {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-12px);
      }

      40% {
        transform: translateX(11px);
      }

      60% {
        transform: translateX(-8px);
      }

      80% {
        transform: translateX(6px);
      }

    }


    /* ==================================================
       ГЕРОЙ — ТЕПЕРЬ ПО ЦЕНТРУ
    ================================================== */

    .hero-zone {
      position: absolute;

      left: 50%;
      bottom: 1%;

      transform: translateX(-50%);

      z-index: 40;

      width:
        min(280px, 29vw);

      min-width: 150px;

      pointer-events: none;

      text-align: center;
    }


    #heroImage {
      display: block;

      width: 100%;

      max-height: 48vh;

      object-fit: contain;

      object-position: bottom center;

      filter:
        drop-shadow(
          0 8px 7px
          rgba(0,0,0,.18)
        );

      transform-origin: bottom center;
    }


    #heroImage.catch {
      animation:
        heroCatch
        .42s ease;
    }


    @keyframes heroCatch {

      0% {
        transform: scale(1);
      }

      45% {
        transform:
          scale(1.08)
          rotate(-4deg);
      }

      100% {
        transform: scale(1);
      }

    }


    /* ==================================================
       СЧЁТЧИК
    ================================================== */

    .score-box {
      position: absolute;

      right: 18px;
      bottom: 18px;

      z-index: 60;

      min-width: 180px;

      padding: 11px 20px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.95);

      color: #535d46;

      font-weight: 900;

      font-size:
        clamp(17px, 2vw, 24px);

      text-align: center;

      box-shadow:
        0 5px 16px
        rgba(0,0,0,.14);
    }


    .score-number {
      color: #d86124;

      font-size: 1.15em;
    }


    /* ==================================================
       СООБЩЕНИЕ
    ================================================== */

    #toast {
      position: absolute;

      z-index: 200;

      left: 50%;

      bottom: 82px;

      transform:
        translateX(-50%)
        translateY(15px);

      max-width:
        min(520px, 84vw);

      padding: 13px 22px;

      border-radius: 20px;

      background:
        rgba(60,70,49,.94);

      color: white;

      font-weight: 900;

      font-size:
        clamp(16px, 2vw, 22px);

      text-align: center;

      opacity: 0;

      pointer-events: none;

      transition: .2s ease;
    }


    #toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ==================================================
       ЭКРАНЫ МЕЖДУ РАУНДАМИ / ФИНАЛ
    ================================================== */

    #roundScreen,
    #finishScreen {

      background-image:
        linear-gradient(
          rgba(255,255,255,.10),
          rgba(255,255,255,.10)
        ),
        url("fon.png");

      background-size: cover;

      background-position: center;
    }


    .round-card,
    .finish-card {

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width:
        min(620px, 88vw);

      padding:
        32px 26px;

      border-radius: 30px;

      background:
        rgba(255,255,255,.94);

      text-align: center;

      box-shadow:
        0 12px 35px
        rgba(67,91,45,.20);
    }


    .round-card h2,
    .finish-card h2 {

      margin:
        0 0 12px;

      color: #ae5222;

      font-size:
        clamp(36px, 5vw, 60px);
    }


    .round-card p,
    .finish-card p {

      color: #4c5943;

      font-size:
        clamp(18px, 2.3vw, 26px);

      line-height: 1.4;
    }


    .finish-leaves {
      font-size:
        clamp(45px, 7vw, 85px);

      margin-bottom: 10px;
    }


    /* ==================================================
       МОБИЛЬНАЯ ВЕРСИЯ
    ================================================== */

    @media (max-width: 720px) {

      .topbar {
        grid-template-columns:
          1fr auto;
      }


      #taskPill {
        order: 3;

        grid-column:
          1 / -1;
      }


      #leafField {
        inset:
          140px 0 0;
      }


      .hero-zone {
        width: 34vw;
      }


      .leaf {
        width:
          clamp(105px, 22vw, 145px);

        height:
          clamp(105px, 22vw, 145px);
      }


      .score-box {
        right: 10px;
        bottom: 10px;

        min-width: 145px;

        padding:
          9px 13px;
      }

    }

  </style>
</head>


<body>

<div id="game">


  <!-- ==================================================
       СТАРТ
  =================================================== -->

  <section
    id="startScreen"
    class="screen active"
  >

    <div class="start-card">

      <h1>
        Осенний листопад
      </h1>

      <p>
        Помоги мышонку поймать
        листья с картинками
        нужного звука!
      </p>

      <button
        id="startBtn"
        class="main-btn"
        type="button"
      >
        НАЧАТЬ ИГРУ
      </button>

    </div>

  </section>



  <!-- ==================================================
       ИГРА
  =================================================== -->

  <section
    id="playScreen"
    class="screen"
  >


    <div class="topbar">

      <div
        id="roundPill"
        class="pill"
      >
        Раунд 1 из 5
      </div>


      <div
        id="taskPill"
        class="pill"
      >

        Поймай картинки со звуком

        <span id="targetLetter">
          С
        </span>

      </div>


      <button
        id="soundBtn"
        class="sound-btn"
        type="button"
        aria-label="Звук"
      >
        🔊
      </button>

    </div>


    <!-- ЛИСТЬЯ -->

    <div
      id="leafField"
    ></div>


    <!-- ГЕРОЙ -->

    <div class="hero-zone">

      <img
        id="heroImage"
        src="heroes/hero-01.png"
        alt="Мышонок"
      >

    </div>


    <!-- СЧЁТ -->

    <div class="score-box">

      Поймано:

      <span
        id="score"
        class="score-number"
      >
        0
      </span>

      /

      <span id="goal">
        5
      </span>

      🍁

    </div>


    <div
      id="toast"
      aria-live="polite"
    ></div>

  </section>



  <!-- ==================================================
       РАУНД ПРОЙДЕН
  =================================================== -->

  <section
    id="roundScreen"
    class="screen"
  >

    <div class="round-card">

      <h2>
        Отлично!
      </h2>

      <p id="roundResultText">
        Все нужные листья пойманы!
      </p>

      <button
        id="nextRoundBtn"
        class="main-btn"
        type="button"
      >
        СЛЕДУЮЩИЙ РАУНД
      </button>

    </div>

  </section>



  <!-- ==================================================
       ФИНАЛ
  =================================================== -->

  <section
    id="finishScreen"
    class="screen"
  >

    <div class="finish-card">

      <div class="finish-leaves">
        🍁 🍂 🍁
      </div>

      <h2>
        Ура!
      </h2>

      <p>
        Все пять раундов пройдены!
      </p>

      <button
        id="restartBtn"
        class="main-btn"
        type="button"
      >
        ИГРАТЬ ЕЩЁ
      </button>

    </div>

  </section>

</div>



<script>


  /* ==================================================
     ОСНОВНЫЕ НАСТРОЙКИ
  ================================================== */

  const TOTAL_ROUNDS = 5;

  const TARGET_COUNT = 5;



  /* ==================================================
     ЛИСТЬЯ
  ================================================== */

  const LEAF_IMAGES = [

    "leaves/leaf-01.png",

    "leaves/leaf-02.png",

    "leaves/leaf-03.png"

  ];



  /* ==================================================
     ЗВУК С
  ================================================== */

  const S_IMAGES = [

    "sounds/s/s-01.png",
    "sounds/s/s-02.png",
    "sounds/s/s-03.png",
    "sounds/s/s-04.png",
    "sounds/s/s-05.png",
    "sounds/s/s-06.png",
    "sounds/s/s-07.png",
    "sounds/s/s-08.png",
    "sounds/s/s-09.png",
    "sounds/s/s-10.png"

  ];



  /* ==================================================
     ЗВУК Ш
  ================================================== */

  const SH_IMAGES = [

    "sounds/sh/sh-01.png",
    "sounds/sh/sh-02.png",
    "sounds/sh/sh-03.png",
    "sounds/sh/sh-04.png",
    "sounds/sh/sh-05.png",
    "sounds/sh/sh-06.png",
    "sounds/sh/sh-07.png",
    "sounds/sh/sh-08.png",
    "sounds/sh/sh-09.png",
    "sounds/sh/sh-10.png"

  ];



  /* ==================================================
     ОБЩИЙ СПИСОК
  ================================================== */

  const ITEMS = [];


  S_IMAGES.forEach(
    (image, index) => {

      ITEMS.push({

        id:
          `s-${index + 1}`,

        sound:
          "S",

        image:
          image

      });

    }
  );


  SH_IMAGES.forEach(
    (image, index) => {

      ITEMS.push({

        id:
          `sh-${index + 1}`,

        sound:
          "SH",

        image:
          image

      });

    }
  );



  /* ==================================================
     5 РАУНДОВ
  ================================================== */

  const ROUNDS = [

    {
      target: "S",
      letter: "С"
    },

    {
      target: "SH",
      letter: "Ш"
    },

    {
      target: "S",
      letter: "С"
    },

    {
      target: "SH",
      letter: "Ш"
    },

    {
      target: "S",
      letter: "С"
    }

  ];



  /* ==================================================
     ЭЛЕМЕНТЫ
  ================================================== */

  const startScreen =
    document.getElementById(
      "startScreen"
    );


  const playScreen =
    document.getElementById(
      "playScreen"
    );


  const roundScreen =
    document.getElementById(
      "roundScreen"
    );


  const finishScreen =
    document.getElementById(
      "finishScreen"
    );


  const startBtn =
    document.getElementById(
      "startBtn"
    );


  const nextRoundBtn =
    document.getElementById(
      "nextRoundBtn"
    );


  const restartBtn =
    document.getElementById(
      "restartBtn"
    );


  const soundBtn =
    document.getElementById(
      "soundBtn"
    );


  const leafField =
    document.getElementById(
      "leafField"
    );


  const roundPill =
    document.getElementById(
      "roundPill"
    );


  const targetLetter =
    document.getElementById(
      "targetLetter"
    );


  const scoreEl =
    document.getElementById(
      "score"
    );


  const goalEl =
    document.getElementById(
      "goal"
    );


  const heroImage =
    document.getElementById(
      "heroImage"
    );


  const toast =
    document.getElementById(
      "toast"
    );


  const roundResultText =
    document.getElementById(
      "roundResultText"
    );



  /* ==================================================
     СОСТОЯНИЕ
  ================================================== */

  let currentRound = 0;

  let score = 0;

  let soundOn = true;

  let leaves = [];

  let animationId = null;

  let active = false;

  let lastTime =
    performance.now();

  let spawnTimer = 0;

  let toastTimer = null;


  goalEl.textContent =
    TARGET_COUNT;



  /* ==================================================
     ПОКАЗАТЬ ЭКРАН
  ================================================== */

  function showScreen(screen) {

    [
      startScreen,
      playScreen,
      roundScreen,
      finishScreen
    ]

    .forEach(
      element => {

        element.classList.remove(
          "active"
        );

      }
    );


    screen.classList.add(
      "active"
    );

  }



  /* ==================================================
     НАЧАТЬ ИГРУ
  ================================================== */

  function startGame() {

    currentRound = 0;

    startRound();

  }



  /* ==================================================
     НАЧАТЬ РАУНД
  ================================================== */

  function startRound() {

    stopGameLoop();

    clearLeaves();


    score = 0;


    scoreEl.textContent =
      score;


    const round =
      ROUNDS[currentRound];


    roundPill.textContent =
      `Раунд ${currentRound + 1} из ${TOTAL_ROUNDS}`;


    targetLetter.textContent =
      round.letter;


    showScreen(
      playScreen
    );


    active = true;

    spawnTimer = 0;

    lastTime =
      performance.now();


    /* первые листья */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      spawnLeaf(true);

    }


    animationId =
      requestAnimationFrame(
        gameLoop
      );

  }



  /* ==================================================
     СОЗДАТЬ ЛИСТ
  ================================================== */

  function spawnLeaf(
    initial = false
  ) {

    if (!active) {
      return;
    }


    const fieldRect =
      leafField
        .getBoundingClientRect();


    if (
      fieldRect.width < 100 ||
      fieldRect.height < 100
    ) {

      return;

    }


    const target =
      ROUNDS[currentRound].target;


    let sound;


    /*
      Примерно половина листьев —
      правильные.
    */

    if (
      Math.random() < 0.52
    ) {

      sound =
        target;

    }

    else {

      sound =
        target === "S"
          ? "SH"
          : "S";

    }


    const possible =
      ITEMS.filter(
        item =>
          item.sound === sound
      );


    const item =
      possible[
        Math.floor(
          Math.random()
          * possible.length
        )
      ];


    const leafImage =
      LEAF_IMAGES[
        Math.floor(
          Math.random()
          * LEAF_IMAGES.length
        )
      ];


    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "leaf";


    button.innerHTML = `

      <div class="leaf-inner">

        <img
          class="leaf-image"
          src="${leafImage}"
          alt=""
          draggable="false"
        >

        <img
          class="object-image"
          src="${item.image}"
          alt=""
          draggable="false"
        >

      </div>

    `;


    leafField.appendChild(
      button
    );


    const size =
      Math.max(
        120,
        Math.min(
          190,
          fieldRect.width * .13
        )
      );


    /*
      Теперь листья могут появляться
      почти по всей ширине полянки.
    */

    const minX =
      15;


    const maxX =
      Math.max(
        30,
        fieldRect.width
        - size
        - 15
      );


    const x =
      minX
      +
      Math.random()
      *
      (maxX - minX);


    let y;


    if (initial) {

      y =
        20
        +
        Math.random()
        *
        Math.max(
          80,
          fieldRect.height * .60
        );

    }

    else {

      y =
        -size
        -
        Math.random()
        * 100;

    }


    const leafData = {

      element:
        button,

      item:
        item,

      baseX:
        x,

      y:
        y,

      speedY:
        13
        +
        Math.random()
        * 13,

      swayAmount:
        30
        +
        Math.random()
        * 55,

      swaySpeed:
        .45
        +
        Math.random()
        * .6,

      phase:
        Math.random()
        * Math.PI
        * 2,

      angle:
        -8
        +
        Math.random()
        * 16,

      rotateSpeed:
        (
          Math.random() - .5
        )
        * 10,

      born:
        performance.now(),

      removed:
        false

    };


    button.addEventListener(

      "pointerdown",

      event => {

        event.preventDefault();

        chooseLeaf(
          leafData
        );

      }

    );


    leaves.push(
      leafData
    );

  }



  /* ==================================================
     НАЖАТИЕ НА ЛИСТ
  ================================================== */

  function chooseLeaf(
    leaf
  ) {

    if (
      !active ||
      leaf.removed
    ) {

      return;

    }


    const target =
      ROUNDS[currentRound].target;



    /* ---------- ПРАВИЛЬНО ---------- */

    if (
      leaf.item.sound === target
    ) {

      leaf.removed =
        true;


      leaf.element.classList.add(
        "correct"
      );


      score++;


      scoreEl.textContent =
        score;


      heroImage.classList.remove(
        "catch"
      );


      void heroImage.offsetWidth;


      heroImage.classList.add(
        "catch"
      );


      playTone(
        620 + score * 35,
        .09
      );


      if (
        score >= TARGET_COUNT
      ) {

        active =
          false;


        showToast(
          "Отлично! Все листья пойманы! 🍁"
        );


        setTimeout(
          finishRound,
          800
        );

      }

    }


    /* ---------- НЕПРАВИЛЬНО ---------- */

    else {

      leaf.element
        .classList
        .remove(
          "wrong"
        );


      void leaf.element.offsetWidth;


      leaf.element
        .classList
        .add(
          "wrong"
        );


      showToast(
        "Послушай ещё раз 🙂"
      );


      playTone(
        210,
        .09
      );


      setTimeout(
        () => {

          leaf.element
            .classList
            .remove(
              "wrong"
            );

        },
        470
      );

    }

  }



  /* ==================================================
     КОНЕЦ РАУНДА
  ================================================== */

  function finishRound() {

    stopGameLoop();

    clearLeaves();


    if (
      currentRound
      === TOTAL_ROUNDS - 1
    ) {

      showFinish();

      return;

    }


    roundResultText.textContent =
      `Раунд ${currentRound + 1} пройден!`;


    showScreen(
      roundScreen
    );

  }



  /* ==================================================
     СЛЕДУЮЩИЙ РАУНД
  ================================================== */

  function nextRound() {

    currentRound++;


    if (
      currentRound >= TOTAL_ROUNDS
    ) {

      showFinish();

      return;

    }


    startRound();

  }



  /* ==================================================
     ДВИЖЕНИЕ ЛИСТЬЕВ
  ================================================== */

  function gameLoop(time) {

    if (!active) {
      return;
    }


    const dt =
      Math.min(
        .05,
        (
          time - lastTime
        )
        / 1000
      );


    lastTime =
      time;


    const fieldRect =
      leafField
        .getBoundingClientRect();


    spawnTimer +=
      dt;


    /*
      Новый лист.
    */

    if (
      spawnTimer >= 1.35 &&
      leaves.length < 9
    ) {

      spawnTimer = 0;

      spawnLeaf(false);

    }


    leaves.forEach(
      leaf => {

        if (
          leaf.removed
        ) {

          return;

        }


        const age =
          (
            time - leaf.born
          )
          / 1000;


        leaf.y +=
          leaf.speedY
          * dt;


        leaf.angle +=
          leaf.rotateSpeed
          * dt;


        const sway =

          Math.sin(

            age
            *
            leaf.swaySpeed
            *
            2.2

            +

            leaf.phase

          )

          *

          leaf.swayAmount;


        const x =
          leaf.baseX
          +
          sway;


        leaf.element.style.transform =

          `translate3d(
            ${x}px,
            ${leaf.y}px,
            0
          )
          rotate(
            ${leaf.angle}deg
          )`;


        /*
          Возвращаем лист наверх.
        */

        if (
          leaf.y >
          fieldRect.height
          + 180
        ) {

          leaf.y =
            -180
            -
            Math.random()
            * 120;


          const size =
            Math.max(
              120,
              Math.min(
                190,
                fieldRect.width * .13
              )
            );


          leaf.baseX =
            15
            +
            Math.random()
            *
            Math.max(
              30,
              fieldRect.width
              - size
              - 30
            );


          leaf.phase =
            Math.random()
            *
            Math.PI
            *
            2;

        }

      }
    );


    leaves =
      leaves.filter(
        leaf => {

          if (
            !leaf.removed
          ) {

            return true;

          }


          setTimeout(
            () => {

              if (
                leaf.element
                  .isConnected
              ) {

                leaf.element.remove();

              }

            },
            560
          );


          return false;

        }
      );


    animationId =
      requestAnimationFrame(
        gameLoop
      );

  }



  /* ==================================================
     ОСТАНОВИТЬ ИГРУ
  ================================================== */

  function stopGameLoop() {

    active =
      false;


    if (
      animationId !== null
    ) {

      cancelAnimationFrame(
        animationId
      );


      animationId =
        null;

    }

  }



  /* ==================================================
     УДАЛИТЬ ЛИСТЬЯ
  ================================================== */

  function clearLeaves() {

    leaves = [];

    leafField.innerHTML = "";

  }



  /* ==================================================
     СООБЩЕНИЯ
  ================================================== */

  function showToast(text) {

    clearTimeout(
      toastTimer
    );


    toast.textContent =
      text;


    toast.classList.add(
      "show"
    );


    toastTimer =
      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        1300
      );

  }



  /* ==================================================
     ФИНАЛ
  ================================================== */

  function showFinish() {

    stopGameLoop();

    clearLeaves();


    showScreen(
      finishScreen
    );


    playTone(
      700,
      .12
    );


    setTimeout(
      () => {

        playTone(
          850,
          .12
        );

      },
      140
    );


    setTimeout(
      () => {

        playTone(
          1000,
          .16
        );

      },
      280
    );

  }



  /* ==================================================
     ИГРАТЬ ЗАНОВО
  ================================================== */

  function restartGame() {

    currentRound = 0;

    startRound();

  }



  /* ==================================================
     ЗВУК
  ================================================== */

  function playTone(
    frequency = 500,
    duration = .1
  ) {

    if (!soundOn) {
      return;
    }


    try {

      const AudioContext =
        window.AudioContext
        ||
        window.webkitAudioContext;


      if (!AudioContext) {
        return;
      }


      const context =
        new AudioContext();


      const oscillator =
        context.createOscillator();


      const gain =
        context.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        .045,
        context.currentTime
      );


      gain.gain.exponentialRampToValueAtTime(

        .001,

        context.currentTime
        +
        duration

      );


      oscillator.connect(
        gain
      );


      gain.connect(
        context.destination
      );


      oscillator.start();


      oscillator.stop(
        context.currentTime
        +
        duration
      );


      oscillator.addEventListener(

        "ended",

        () => {

          context.close();

        }

      );

    }


    catch(error) {

      console.log(
        "Sound error:",
        error
      );

    }

  }



  /* ==================================================
     ВКЛ / ВЫКЛ ЗВУКА
  ================================================== */

  function toggleSound() {

    soundOn =
      !soundOn;


    soundBtn.textContent =
      soundOn
        ? "🔊"
        : "🔇";

  }



  /* ==================================================
     КНОПКИ
  ================================================== */

  startBtn.addEventListener(
    "click",
    startGame
  );


  nextRoundBtn.addEventListener(
    "click",
    nextRound
  );


  restartBtn.addEventListener(
    "click",
    restartGame
  );


  soundBtn.addEventListener(
    "click",
    toggleSound
  );


</script>

</body>
