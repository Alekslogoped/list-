<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Осенний листопад — С и Ш</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #dcefcf;
    }

    button {
      font: inherit;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          rgba(196, 232, 255, .9) 0 32%,
          rgba(207, 236, 179, .95) 32% 100%
        );
    }

    /* =========================
       ЭКРАНЫ
    ========================= */

    .screen {
      position: absolute;
      inset: 0;
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* =========================
       СТАРТОВЫЙ ЭКРАН
    ========================= */

    #startScreen {
      padding: 24px;
      text-align: center;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255, 255, 255, .8),
          transparent 18%
        ),
        radial-gradient(
          circle at 85% 18%,
          rgba(255, 255, 255, .7),
          transparent 16%
        ),
        linear-gradient(
          #bfe4ff 0 43%,
          #dbe9a9 43% 100%
        );
    }

    .start-card {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(640px, 88vw);

      padding: 28px 24px;

      background: rgba(255, 255, 255, .92);

      border: 4px solid #ffffff;
      border-radius: 28px;

      box-shadow:
        0 12px 35px rgba(67, 91, 45, .18);
    }

    .start-card h1 {
      margin: 0 0 10px;

      font-size: clamp(34px, 6vw, 64px);
      line-height: .95;

      color: #a5541d;
    }

    .start-card p {
      margin: 14px auto 24px;

      max-width: 520px;

      font-size: clamp(18px, 2.5vw, 27px);
      line-height: 1.35;

      color: #3f5136;
    }

    .main-btn {
      border: 0;
      border-radius: 18px;

      padding: 15px 28px;

      min-height: 56px;

      cursor: pointer;

      background: #e97b31;
      color: white;

      font-weight: 800;
      font-size: clamp(18px, 2vw, 25px);

      box-shadow:
        0 7px 0 #b95821;
    }

    .main-btn:active {
      transform: translateY(4px);

      box-shadow:
        0 3px 0 #b95821;
    }

    /* =========================
       ИГРОВОЕ ПОЛЕ
    ========================= */

    #playScreen {
      background:
        radial-gradient(
          circle at 13% 68%,
          #9ab65f 0 7%,
          transparent 7.5%
        ),
        radial-gradient(
          circle at 86% 68%,
          #839f50 0 8%,
          transparent 8.5%
        ),
        linear-gradient(
          #bfe2f7 0 38%,
          #d6e5a8 38% 100%
        );
    }

    /*
      ВРЕМЕННЫЙ ФОН.

      Позже заменим его на:

      background-image: url("fon.png");
      background-size: cover;
      background-position: center;
    */

    #playScreen::before {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 42%;

      background:
        radial-gradient(
          ellipse at 20% 70%,
          #78994c 0 16%,
          transparent 17%
        ),
        radial-gradient(
          ellipse at 65% 82%,
          #8cab55 0 18%,
          transparent 19%
        ),
        radial-gradient(
          ellipse at 92% 72%,
          #6f8f45 0 15%,
          transparent 16%
        );

      opacity: .75;

      pointer-events: none;
    }

    /* =========================
       ВЕРХНЯЯ ПАНЕЛЬ
    ========================= */

    .topbar {
      position: absolute;

      top: 12px;
      left: 12px;
      right: 12px;

      z-index: 50;

      display: grid;

      grid-template-columns:
        auto 1fr auto;

      align-items: center;

      gap: 12px;
    }

    .pill {
      min-height: 50px;

      padding: 11px 17px;

      border-radius: 18px;

      background:
        rgba(255, 255, 255, .92);

      border:
        2px solid rgba(255, 255, 255, .9);

      box-shadow:
        0 5px 15px rgba(0, 0, 0, .10);

      color: #44523c;

      font-weight: 800;

      font-size:
        clamp(15px, 1.8vw, 22px);
    }

    #taskPill {
      text-align: center;

      color: #99491d;

      font-size:
        clamp(18px, 2.3vw, 29px);
    }

    .sound-btn {
      width: 52px;
      height: 52px;

      padding: 0;

      border: 0;
      border-radius: 18px;

      cursor: pointer;

      background:
        rgba(255, 255, 255, .92);

      font-size: 27px;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, .10);
    }

    /* =========================
       ГЕРОЙ
    ========================= */

    .hero-zone {
      position: absolute;

      left: 3%;
      bottom: 3%;

      z-index: 20;

      width: min(250px, 28vw);
      min-width: 135px;

      text-align: center;

      pointer-events: none;
    }

    #hero {
      width: 100%;

      aspect-ratio: 1 / 1;

      display: grid;
      place-items: center;

      font-size:
        clamp(80px, 12vw, 160px);

      filter:
        drop-shadow(
          0 8px 5px rgba(0, 0, 0, .15)
        );

      transform-origin:
        bottom center;
    }

    #hero.catch {
      animation:
        heroCatch .42s ease;
    }

    @keyframes heroCatch {

      0% {
        transform:
          scale(1)
          rotate(0);
      }

      45% {
        transform:
          scale(1.08)
          rotate(-5deg);
      }

      100% {
        transform:
          scale(1)
          rotate(0);
      }
    }

    .basket {
      margin:
        -16px auto 0;

      width: 74%;

      min-height: 66px;

      padding: 8px 10px;

      border-radius:
        0 0 24px 24px;

      background: #b97835;

      border:
        5px solid #8b5425;

      color: white;

      font-weight: 800;

      font-size:
        clamp(14px, 1.7vw, 20px);

      box-shadow:
        inset 0 8px 0
        rgba(255, 255, 255, .14);
    }

    /* =========================
       ПОЛЕ С ЛИСТЬЯМИ
    ========================= */

    #leafField {
      position: absolute;

      inset:
        70px 0 0;

      overflow: hidden;

      z-index: 10;
    }

    .leaf {
      position: absolute;

      left: 0;
      top: 0;

      width:
        clamp(86px, 10vw, 132px);

      height:
        clamp(86px, 10vw, 132px);

      border: 0;
      padding: 0;

      cursor: pointer;

      background: transparent;

      touch-action: manipulation;

      transform-origin:
        50% 50%;

      will-change: transform;
    }

    /* =========================
       КЛЕНОВЫЙ ЛИСТ
    ========================= */

    .leaf-shape {
      position: absolute;

      inset: 7%;

      display: grid;

      place-items: center;

      clip-path:
        polygon(
          50% 0%,
          59% 20%,
          75% 11%,
          72% 31%,
          94% 29%,
          79% 48%,
          100% 57%,
          74% 63%,
          81% 86%,
          58% 73%,
          52% 100%,
          44% 74%,
          22% 86%,
          27% 64%,
          0% 57%,
          22% 47%,
          7% 30%,
          29% 31%,
          25% 11%,
          42% 21%
        );

      background:
        linear-gradient(
          145deg,
          #f5aa31,
          #d85f25 63%,
          #b84421
        );

      border-radius: 25%;

      filter:
        drop-shadow(
          0 6px 4px rgba(80, 40, 10, .2)
        );
    }

    .leaf:nth-child(3n + 2)
    .leaf-shape {

      background:
        linear-gradient(
          145deg,
          #f7c146,
          #e88925 62%,
          #ca4b20
        );
    }

    .leaf:nth-child(3n + 3)
    .leaf-shape {

      background:
        linear-gradient(
          145deg,
          #e8992b,
          #cc5326 62%,
          #a93b25
        );
    }

    /* =========================
       КАРТИНКА НА ЛИСТЕ
    ========================= */

    .picture {
      position: relative;

      z-index: 2;

      width: 50%;
      height: 50%;

      display: grid;

      place-items: center;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, .94);

      box-shadow:
        0 2px 8px rgba(0, 0, 0, .13);

      font-size:
        clamp(26px, 4.6vw, 55px);

      line-height: 1;

      pointer-events: none;
    }

    /* =========================
       ПРАВИЛЬНЫЙ ВЫБОР
    ========================= */

    .leaf.correct {
      pointer-events: none;

      animation:
        leafCaught .45s ease forwards;
    }

    @keyframes leafCaught {

      0% {
        opacity: 1;
        filter: none;
      }

      50% {
        transform:
          scale(1.25);
      }

      100% {
        opacity: 0;

        transform:
          scale(.2);
      }
    }

    /* =========================
       ОШИБКА
    ========================= */

    .leaf.wrong .leaf-shape {
      animation:
        wrongShake .4s ease;

      filter:
        drop-shadow(
          0 0 8px rgba(197, 35, 35, .8)
        );
    }

    @keyframes wrongShake {

      0%,
      100% {
        transform: rotate(0);
      }

      20% {
        transform: rotate(-10deg);
      }

      40% {
        transform: rotate(9deg);
      }

      60% {
        transform: rotate(-7deg);
      }

      80% {
        transform: rotate(5deg);
      }
    }

    /* =========================
       СООБЩЕНИЕ
    ========================= */

    #toast {
      position: absolute;

      z-index: 100;

      left: 50%;
      bottom: 22px;

      transform:
        translateX(-50%)
        translateY(15px);

      max-width:
        min(520px, 85vw);

      padding:
        13px 20px;

      border-radius: 18px;

      background:
        rgba(61, 72, 50, .94);

      color: white;

      font-weight: 800;

      font-size:
        clamp(16px, 2vw, 22px);

      text-align: center;

      opacity: 0;

      pointer-events: none;

      transition:
        .2s ease;
    }

    #toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       МЕЖДУ РАУНДАМИ
    ========================= */

    #roundScreen {
      background:
        linear-gradient(
          #bfe4ff,
          #dce9b1
        );

      text-align: center;
    }

    .round-card,
    .finish-card {

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width:
        min(620px, 88vw);

      padding:
        30px 24px;

      border-radius: 28px;

      background:
        rgba(255, 255, 255, .94);

      box-shadow:
        0 12px 35px
        rgba(67, 91, 45, .18);
    }

    .round-card h2,
    .finish-card h2 {

      margin:
        0 0 12px;

      font-size:
        clamp(34px, 5vw, 58px);

      color: #a5541d;
    }

    .round-card p,
    .finish-card p {

      font-size:
        clamp(18px, 2.3vw, 26px);

      color: #48563f;

      line-height: 1.35;
    }

    /* =========================
       ФИНАЛ
    ========================= */

    #finishScreen {

      background:
        radial-gradient(
          circle at 20% 25%,
          #fff1a6 0 8%,
          transparent 8.5%
        ),
        radial-gradient(
          circle at 80% 24%,
          #ffd97d 0 8%,
          transparent 8.5%
        ),
        linear-gradient(
          #c6e8ff 0 42%,
          #dce7a7 42% 100%
        );
    }

    .finish-leaves {

      font-size:
        clamp(38px, 7vw, 82px);

      letter-spacing: 8px;

      margin-bottom: 6px;
    }

    /* =========================
       МОБИЛЬНАЯ ВЕРСИЯ
    ========================= */

    @media (max-width: 700px) {

      .topbar {
        grid-template-columns:
          1fr auto;
      }

      #taskPill {
        order: 3;

        grid-column:
          1 / -1;
      }

      #leafField {
        inset:
          125px 0 0;
      }

      .hero-zone {
        width: 30vw;
      }
    }

  </style>
</head>


<body>

<div id="game">

  <!-- =========================
       СТАРТ
  ========================== -->

  <section
    id="startScreen"
    class="screen active">

    <div class="start-card">

      <h1>
        Осенний листопад
      </h1>

      <p>
        Лови листья с картинками
        нужного звука.
        В игре 5 раундов.
      </p>

      <button
        id="startBtn"
        class="main-btn"
        type="button">

        НАЧАТЬ ИГРУ

      </button>

    </div>

  </section>


  <!-- =========================
       ИГРА
  ========================== -->

  <section
    id="playScreen"
    class="screen">

    <div class="topbar">

      <div
        id="roundPill"
        class="pill">

        Раунд 1 из 5

      </div>


      <div
        id="taskPill"
        class="pill">

        Лови звук С

      </div>


      <button
        id="soundBtn"
        class="sound-btn"
        type="button">

        🔊

      </button>

    </div>


    <div
      id="leafField">
    </div>


    <!-- ГЕРОЙ -->

    <div class="hero-zone">

      <div id="hero">
        🦔
      </div>

      <div class="basket">

        Поймано:

        <span id="score">
          0
        </span>

        /

        <span id="goal">
          5
        </span>

      </div>

    </div>


    <div
      id="toast">
    </div>

  </section>


  <!-- =========================
       РАУНД ПРОЙДЕН
  ========================== -->

  <section
    id="roundScreen"
    class="screen">

    <div class="round-card">

      <h2>
        Отлично!
      </h2>

      <p id="roundResultText">
        Все нужные листья пойманы.
      </p>

      <button
        id="nextRoundBtn"
        class="main-btn"
        type="button">

        СЛЕДУЮЩИЙ РАУНД

      </button>

    </div>

  </section>


  <!-- =========================
       ФИНАЛ
  ========================== -->

  <section
    id="finishScreen"
    class="screen">

    <div class="finish-card">

      <div class="finish-leaves">
        🍁🍂🍁
      </div>

      <h2>
        Ура!
      </h2>

      <p>
        Все 5 раундов пройдены!
      </p>

      <button
        id="restartBtn"
        class="main-btn"
        type="button">

        ИГРАТЬ ЕЩЁ

      </button>

    </div>

  </section>

</div>


<script>

  /* =====================================================
     НАСТРОЙКИ ИГРЫ
  ===================================================== */

  const TOTAL_ROUNDS = 5;

  const TARGET_COUNT = 5;


  /* =====================================================
     КАРТИНКИ

     Пока здесь emoji.

     Позже заменим их на PNG,
     которые ты загрузишь на GitHub.
  ===================================================== */

  const ITEMS = [

    /* ---------- ЗВУК С ---------- */

    {
      id: "sok",
      sound: "S",
      emoji: "🧃",
      name: "сок"
    },

    {
      id: "sir",
      sound: "S",
      emoji: "🧀",
      name: "сыр"
    },

    {
      id: "sova",
      sound: "S",
      emoji: "🦉",
      name: "сова"
    },

    {
      id: "sun",
      sound: "S",
      emoji: "☀️",
      name: "солнце"
    },

    {
      id: "dog",
      sound: "S",
      emoji: "🐕",
      name: "собака"
    },

    {
      id: "nose",
      sound: "S",
      emoji: "👃",
      name: "нос"
    },


    /* ---------- ЗВУК Ш ---------- */

    {
      id: "balloon",
      sound: "SH",
      emoji: "🎈",
      name: "шар"
    },

    {
      id: "hat",
      sound: "SH",
      emoji: "🎩",
      name: "шляпа"
    },

    {
      id: "mouse",
      sound: "SH",
      emoji: "🐭",
      name: "мышь"
    },

    {
      id: "car",
      sound: "SH",
      emoji: "🚗",
      name: "машина"
    },

    {
      id: "chocolate",
      sound: "SH",
      emoji: "🍫",
      name: "шоколад"
    },

    {
      id: "cabinet",
      sound: "SH",
      emoji: "🗄️",
      name: "шкаф"
    }

  ];


  /* =====================================================
     5 РАУНДОВ
  ===================================================== */

  const ROUNDS = [

    {
      target: "S",
      label: "Лови звук С",
      hero: "🦔"
    },

    {
      target: "SH",
      label: "Лови звук Ш",
      hero: "🐿️"
    },

    {
      target: "S",
      label: "Лови звук С",
      hero: "🦊"
    },

    {
      target: "SH",
      label: "Лови звук Ш",
      hero: "🐰"
    },

    {
      target: "S",
      label: "Лови звук С",
      hero: "🐻"
    }

  ];


  /* =====================================================
     ЭЛЕМЕНТЫ
  ===================================================== */

  const startScreen =
    document.getElementById("startScreen");

  const playScreen =
    document.getElementById("playScreen");

  const roundScreen =
    document.getElementById("roundScreen");

  const finishScreen =
    document.getElementById("finishScreen");


  const startBtn =
    document.getElementById("startBtn");

  const nextRoundBtn =
    document.getElementById("nextRoundBtn");

  const restartBtn =
    document.getElementById("restartBtn");

  const soundBtn =
    document.getElementById("soundBtn");


  const roundPill =
    document.getElementById("roundPill");

  const taskPill =
    document.getElementById("taskPill");

  const leafField =
    document.getElementById("leafField");

  const hero =
    document.getElementById("hero");

  const scoreEl =
    document.getElementById("score");

  const goalEl =
    document.getElementById("goal");

  const toast =
    document.getElementById("toast");


  /* =====================================================
     СОСТОЯНИЕ
  ===================================================== */

  let currentRound = 0;

  let score = 0;

  let soundOn = true;

  let leaves = [];

  let animationId = null;

  let lastTime =
    performance.now();

  let spawnTimer = 0;

  let active = false;

  let toastTimer = null;


  goalEl.textContent =
    TARGET_COUNT;


  /* =====================================================
     ЭКРАНЫ
  ===================================================== */

  function showScreen(screen) {

    [
      startScreen,
      playScreen,
      roundScreen,
      finishScreen
    ]
    .forEach(element => {

      element.classList.remove("active");

    });


    screen.classList.add("active");

  }


  /* =====================================================
     НАЧАЛО ИГРЫ
  ===================================================== */

  function startGame() {

    currentRound = 0;

    startRound();

  }


  /* =====================================================
     НАЧАЛО РАУНДА
  ===================================================== */

  function startRound() {

    stopGameLoop();

    clearLeaves();


    score = 0;

    scoreEl.textContent =
      score;


    const round =
      ROUNDS[currentRound];


    roundPill.textContent =
      `Раунд ${currentRound + 1} из ${TOTAL_ROUNDS}`;


    taskPill.textContent =
      round.label;


    hero.textContent =
      round.hero;


    showScreen(playScreen);


    active = true;

    spawnTimer = 0;

    lastTime =
      performance.now();


    /* Сразу показываем несколько листьев */

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      spawnLeaf(true);

    }


    animationId =
      requestAnimationFrame(gameLoop);

  }


  /* =====================================================
     СЛЕДУЮЩИЙ РАУНД
  ===================================================== */

  function nextRound() {

    currentRound++;


    if (
      currentRound >= TOTAL_ROUNDS
    ) {

      showFinish();

      return;

    }


    startRound();

  }


  /* =====================================================
     ФИНАЛ
  ===================================================== */

  function showFinish() {

    stopGameLoop();

    clearLeaves();

    showScreen(
      finishScreen
    );


    playTone(
      720,
      0.13
    );


    setTimeout(
      () => {

        playTone(
          880,
          0.17
        );

      },
      150
    );

  }


  function restartGame() {

    currentRound = 0;

    startRound();

  }


  /* =====================================================
     СОЗДАНИЕ ЛИСТА
  ===================================================== */

  function spawnLeaf(initial = false) {

    if (!active) {
      return;
    }


    const fieldRect =
      leafField.getBoundingClientRect();


    if (
      fieldRect.width < 100 ||
      fieldRect.height < 100
    ) {

      return;

    }


    const currentTarget =
      ROUNDS[currentRound].target;


    let desiredSound;


    /*
      Примерно половина листьев
      будет правильной.
    */

    if (
      Math.random() < 0.52
    ) {

      desiredSound =
        currentTarget;

    }

    else {

      desiredSound =
        currentTarget === "S"
          ? "SH"
          : "S";

    }


    const possible =
      ITEMS.filter(
        item =>
          item.sound === desiredSound
      );


    const item =
      possible[
        Math.floor(
          Math.random()
          * possible.length
        )
      ];


    /* Создаём кнопку-лист */

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "leaf";


    button.setAttribute(
      "aria-label",
      item.name
    );


    button.dataset.sound =
      item.sound;


    button.innerHTML = `

      <span class="leaf-shape">

        <span class="picture">

          ${item.emoji}

        </span>

      </span>

    `;


    leafField.appendChild(
      button
    );


    const leafSize =
      Math.max(
        86,
        Math.min(
          132,
          fieldRect.width * 0.10
        )
      );


    /*
      Слева оставляем место
      для героя.
    */

    const safeLeft =
      fieldRect.width * 0.25;


    const minX =
      safeLeft;


    const maxX =
      Math.max(
        minX + 20,
        fieldRect.width
          - leafSize
          - 20
      );


    const x =
      minX
      + Math.random()
      * (maxX - minX);


    let y;


    if (initial) {

      y =
        30
        + Math.random()
        * Math.max(
          60,
          fieldRect.height * 0.55
        );

    }

    else {

      y =
        -leafSize
        - Math.random() * 80;

    }


    const leafData = {

      el: button,

      item: item,

      x: x,

      y: y,

      baseX: x,

      speedY:
        12
        + Math.random() * 12,

      driftSpeed:
        0.55
        + Math.random() * 0.65,

      driftAmount:
        24
        + Math.random() * 46,

      angle:
        Math.random() * 360,

      rotateSpeed:
        (Math.random() - 0.5)
        * 18,

      phase:
        Math.random()
        * Math.PI
        * 2,

      bornAt:
        performance.now(),

      removed:
        false

    };


    /*
      POINTERDOWN работает
      и мышкой, и пальцем.
    */

    button.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        chooseLeaf(
          leafData
        );

      }
    );


    leaves.push(
      leafData
    );

  }


  /* =====================================================
     ВЫБОР ЛИСТА
  ===================================================== */

  function chooseLeaf(leaf) {

    if (
      !active ||
      leaf.removed
    ) {

      return;

    }


    const target =
      ROUNDS[currentRound].target;


    /* ---------- ПРАВИЛЬНО ---------- */

    if (
      leaf.item.sound === target
    ) {

      leaf.removed =
        true;


      leaf.el.classList.add(
        "correct"
      );


      score++;


      scoreEl.textContent =
        score;


      hero.classList.remove(
        "catch"
      );


      void hero.offsetWidth;


      hero.classList.add(
        "catch"
      );


      playTone(
        620 + score * 35,
        0.09
      );


      /* Раунд закончен */

      if (
        score >= TARGET_COUNT
      ) {

        active =
          false;


        showToast(
          "Все нужные листья пойманы! 🍁"
        );


        setTimeout(
          () => {

            stopGameLoop();

            clearLeaves();


            document
              .getElementById(
                "roundResultText"
              )
              .textContent =
              `Раунд ${currentRound + 1} пройден!`;


            if (
              currentRound
              === TOTAL_ROUNDS - 1
            ) {

              showFinish();

            }

            else {

              showScreen(
                roundScreen
              );

            }

          },
          700
        );

      }

    }


    /* ---------- ОШИБКА ---------- */

    else {

      leaf.el.classList.remove(
        "wrong"
      );


      void leaf.el.offsetWidth;


      leaf.el.classList.add(
        "wrong"
      );


      showToast(
        "Этот лист не подходит 🙂"
      );


      playTone(
        210,
        0.08
      );


      setTimeout(
        () => {

          leaf.el.classList.remove(
            "wrong"
          );

        },
        430
      );

    }

  }


  /* =====================================================
     АНИМАЦИЯ ЛИСТЬЕВ
  ===================================================== */

  function gameLoop(time) {

    if (!active) {
      return;
    }


    const dt =
      Math.min(
        0.05,
        (time - lastTime) / 1000
      );


    lastTime =
      time;


    const fieldRect =
      leafField.getBoundingClientRect();


    spawnTimer +=
      dt;


    /*
      Новый лист появляется
      примерно каждые 1.25 секунды.
    */

    if (
      spawnTimer >= 1.25 &&
      leaves.length < 10
    ) {

      spawnTimer = 0;

      spawnLeaf(false);

    }


    leaves.forEach(
      leaf => {

        if (
          leaf.removed
        ) {

          return;

        }


        const age =
          (time - leaf.bornAt)
          / 1000;


        leaf.y +=
          leaf.speedY * dt;


        leaf.angle +=
          leaf.rotateSpeed * dt;


        /*
          Лист покачивается
          вправо-влево.
        */

        const sway =
          Math.sin(
            age
            * leaf.driftSpeed
            * 2.2
            + leaf.phase
          )
          * leaf.driftAmount;


        const drawX =
          leaf.baseX + sway;


        leaf.el.style.transform =

          `translate3d(
            ${drawX}px,
            ${leaf.y}px,
            0
          )
          rotate(
            ${leaf.angle}deg
          )`;


        /*
          Лист дошёл до низа —
          отправляем его наверх.
        */

        if (
          leaf.y
          > fieldRect.height + 150
        ) {

          leaf.y =
            -150
            - Math.random() * 120;


          leaf.baseX =

            fieldRect.width
            * 0.25

            +

            Math.random()

            *

            Math.max(
              20,
              fieldRect.width * 0.65
            );


          leaf.phase =
            Math.random()
            * Math.PI
            * 2;

        }

      }
    );


    /*
      Удаляем пойманные листья.
    */

    leaves =
      leaves.filter(
        leaf => {

          if (
            !leaf.removed
          ) {

            return true;

          }


          if (
            leaf.el.isConnected
          ) {

            setTimeout(
              () => {

                leaf.el.remove();

              },
              460
            );

          }


          return false;

        }
      );


    animationId =
      requestAnimationFrame(
        gameLoop
      );

  }


  /* =====================================================
     ОСТАНОВКА
  ===================================================== */

  function stopGameLoop() {

    active =
      false;


    if (
      animationId !== null
    ) {

      cancelAnimationFrame(
        animationId
      );


      animationId =
        null;

    }

  }


  /* =====================================================
     ОЧИСТКА ЛИСТЬЕВ
  ===================================================== */

  function clearLeaves() {

    leaves = [];

    leafField.innerHTML = "";

  }


  /* =====================================================
     СООБЩЕНИЯ
  ===================================================== */

  function showToast(text) {

    clearTimeout(
      toastTimer
    );


    toast.textContent =
      text;


    toast.classList.add(
      "show"
    );


    toastTimer =
      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        1150
      );

  }


  /* =====================================================
     ЗВУК
  ===================================================== */

  function playTone(
    frequency = 500,
    duration = 0.1
  ) {

    if (!soundOn) {
      return;
    }


    try {

      const AudioContext =
        window.AudioContext
        ||
        window.webkitAudioContext;


      if (!AudioContext) {
        return;
      }


      const ctx =
        new AudioContext();


      const oscillator =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        0.05,
        ctx.currentTime
      );


      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        ctx.destination
      );


      oscillator.start();


      oscillator.stop(
        ctx.currentTime + duration
      );


      oscillator.addEventListener(
        "ended",
        () => {

          ctx.close();

        }
      );

    }

    catch (error) {

      console.log(
        "Sound error:",
        error
      );

    }

  }


  /* =====================================================
     ВКЛ / ВЫКЛ ЗВУКА
  ===================================================== */

  function toggleSound() {

    soundOn =
      !soundOn;


    soundBtn.textContent =
      soundOn
        ? "🔊"
        : "🔇";

  }


  /* =====================================================
     КНОПКИ
  ===================================================== */

  startBtn.addEventListener(
    "click",
    startGame
  );


  nextRoundBtn.addEventListener(
    "click",
    nextRound
  );


  restartBtn.addEventListener(
    "click",
    restartGame
  );


  soundBtn.addEventListener(
    "click",
    toggleSound
  );

</script>
